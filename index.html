<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Танки35</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:-apple-system,sans-serif}
body,html{width:100%;height:100%;background:#111827;color:#f3f4f6;overflow:hidden}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;background:#111827;z-index:10;overflow-y:auto}
.box{display:flex;justify-content:space-between;align-items:center;background:#1f2937;padding:10px 14px;border-radius:12px;border:1px solid #374151}
.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:12px;margin:8px 0}
.preview{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.3);border-radius:8px;padding:10px}
.nav{display:flex;justify-content:space-between;width:100%;margin-top:8px}
button{background:#374151;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:bold;font-size:14px}
button:disabled{opacity:.4}
.btn-y{background:#f59e0b;color:#000}
.btn-g{background:#10b981;color:#000}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#game{position:relative;width:100%;height:100%}
canvas#c{display:block;width:100%;height:100%;background:#2b3326}
.hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(0,0,0,.75);padding:6px 16px;border-radius:20px;font-weight:800}
.pause{position:absolute;top:12px;right:12px;z-index:5}
#joy{position:absolute;bottom:25px;left:25px;width:120px;height:120px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center}
#knob{width:48px;height:48px;background:#f59e0b;border-radius:50%;position:absolute;pointer-events:none}
#fire{position:absolute;bottom:35px;right:25px;width:80px;height:80px;border-radius:50%;background:#ef4444;border:3px solid #fff;font-weight:900}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:15px}
.mbox{background:#1f2937;padding:20px;border-radius:16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
</style>
</head>
<body>
<div id="hangar" class="screen">
  <div class="box"><b style="color:#f59e0b">🛡️ ТАНКИ35</b><b style="color:#fbbf24">🪙 <span id="coins">250</span></b></div>
  <div class="card">
    <div class="preview">
      <span id="t-tier" style="color:#f59e0b;font-size:12px;font-weight:bold">Уровень 1</span>
      <canvas id="pc" width="140" height="80"></canvas>
      <h3 id="t-name">МС-1 Разведчик</h3>
    </div>
    <div class="nav">
      <button id="prev">◀</button>
      <button id="sel" class="btn-g">Выбран</button>
      <button id="next">▶</button>
    </div>
  </div>
  <div class="card">
    <div class="row"><span>Броня (<b id="l-hp">Ур.1</b>)</span><button id="b-hp">120 🪙</button></div>
    <div class="row"><span>Пушка (<b id="l-dmg">Ур.1</b>)</span><button id="b-dmg">120 🪙</button></div>
    <div class="row"><span>Скорость (<b id="l-spd">Ур.1</b>)</span><button id="b-spd">120 🪙</button></div>
    <div class="row" style="border:none"><span>Перезарядка (<b id="l-rld">Ур.1</b>)</span><button id="b-rld">120 🪙</button></div>
  </div>
  <div class="box">
    <button id="set-open">⚙️ Настройки</button>
    <button id="play" class="btn-y">⚔️ В БОЙ</button>
  </div>
</div>

<div id="game" class="hidden">
  <canvas id="c"></canvas>
  <div class="hud"><span style="color:#3b82f6">МЫ: <span id="ac">5</span></span>|<span style="color:#ef4444">ВРАГ: <span id="ec">5</span></span></div>
  <button id="pause" class="pause">⏸</button>
  <div id="joy"><div id="knob"></div></div>
  <button id="fire">ОГОНЬ</button>
</div>

<div id="m-set" class="modal hidden">
  <div class="mbox">
    <h3>Настройки</h3>
    <div class="row"><span>Звук</span><input type="range" id="s-vol" min="0" max="1" step="0.1" value="0.5"></div>
    <div class="row"><span>Полоски HP</span><input type="checkbox" id="s-hp" checked></div>
    <button id="set-close" class="btn-y">Готово</button>
  </div>
</div>

<div id="m-res" class="modal hidden">
  <div class="mbox">
    <h2 id="r-title">ПОБЕДА!</h2>
    <p id="r-stat">Уничтожено: 0</p>
    <b style="color:#fbbf24">+<span id="r-rew">0</span> 🪙</b>
    <button id="to-hangar" class="btn-y">В ангар</button>
  </div>
</div>
<script>
const DB = new Array(
  {tier:1,name:"МС-1 Разведчик",price:0,hp:100,dmg:25,spd:3.2,rld:1.0,sz:16,col:"#3b82f6",bar:22},
  {tier:2,name:"Т-34 Средний",price:350,hp:170,dmg:40,spd:2.8,rld:1.2,sz:19,col:"#10b981",bar:26},
  {tier:3,name:"ИС-2 Тяжелый",price:900,hp:280,dmg:65,spd:2.2,rld:1.6,sz:22,col:"#8b5cf6",bar:30},
  {tier:4,name:"Объект-279",price:2000,hp:420,dmg:95,spd:2.0,rld:1.8,sz:25,col:"#f59e0b",bar:34}
);
let sd = {coins:250,unl:new Array(0),sel:0,upg:{hp:1,dmg:1,spd:1,rld:1},vol:0.5,hpbar:true};
try{let s=localStorage.getItem('t5v5');if(s)sd=Object.assign(sd,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem('t5v5',JSON.stringify(sd))}catch(e){}};
let vIdx=sd.sel,actx=null;

function beep(f,d){
  if(sd.vol<=0)return;
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    let o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;g.gain.value=sd.vol*0.2;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

const $=id=>document.getElementById(id);
function ui(){
  $('coins').innerText=sd.coins;
  let t=DB.at(vIdx);
  $('t-tier').innerText="Уровень "+t.tier;$('t-name').innerText=t.name;
  let b=$('sel');
  if(sd.sel===vIdx){b.innerText="Выбран";b.className="";b.disabled=true}
  else if(sd.unl.includes(vIdx)){b.innerText="Выбрать";b.className="btn-g";b.disabled=false}
  else{b.innerText="Купить ("+t.price+")";b.className="btn-y";b.disabled=sd.coins<t.price}
  new Array('hp','dmg','spd','rld').forEach(k=>{
    let l=sd.upg[k],c=l*120;$('l-'+k).innerText="Ур."+l;
    let ub=$('b-'+k);ub.innerText=l>=10?"МАКС":c+" 🪙";ub.disabled=l>=10||sd.coins<c;
  });
  let pc=$('pc'),x=pc.getContext('2d');x.clearRect(0,0,140,80);x.save();x.translate(70,40);
  x.fillStyle=t.col;x.fillRect(-t.sz,-t.sz*.7,t.sz*2,t.sz*1.4);
  x.fillStyle="#111";x.fillRect(0,-3,t.bar,6);x.restore();
}

$('prev').onclick=()=>{vIdx=(vIdx+3)%4;ui()};
$('next').onclick=()=>{vIdx=(vIdx+1)%4;ui()};
$('sel').onclick=()=>{
  let t=DB.at(vIdx);
  if(!sd.unl.includes(vIdx)){if(sd.coins<t.price)return;sd.coins-=t.price;sd.unl.push(vIdx)}
  sd.sel=vIdx;save();ui();
};
new Array('hp','dmg','spd','rld').forEach(k=>{
  $('b-'+k).onclick=()=>{let c=sd.upg[k]*120;if(sd.coins>=c&&sd.upg[k]<10){sd.coins-=c;sd.upg[k]++;save();ui()}};
});
$('set-open').onclick=()=>{$('s-vol').value=sd.vol;$('s-hp').checked=sd.hpbar;$('m-set').classList.remove('hidden')};
$('set-close').onclick=()=>{sd.vol=+$('s-vol').value;sd.hpbar=$('s-hp').checked;save();$('m-set').classList.add('hidden')};

const c=$('c'),ctx=c.getContext('2d'),W=1400,H=900;
let g={on:false,tanks:new Array(),bul:new Array(),blk:new Array(),kills:0,cx:0,cy:0},joy={dx:0,dy:0,fire:false,id:null};

$('joy').addEventListener('touchstart',e=>{e.preventDefault();let t=e.changedTouches.item(0);joy.id=t.identifier;mJoy(t)},{passive:false});
$('joy').addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===joy.id)mJoy(t)},{passive:false});
const eJoy=()=>{joy.id=null;joy.dx=0;joy.dy=0;$('knob').style.transform='translate(0,0)'};
$('joy').addEventListener('touchend',eJoy);$('joy').addEventListener('touchcancel',eJoy);
function mJoy(t){
  let r=$('joy').getBoundingClientRect(),dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60),d=Math.hypot(dx,dy);
  if(d>40){dx=dx/d*40;dy=dy/d*40}
  $('knob').style.transform=`translate(${dx}px,${dy}px)`;joy.dx=dx/40;joy.dy=dy/40;
}
$('fire').addEventListener('touchstart',e=>{e.preventDefault();joy.fire=true},{passive:false});
$('fire').addEventListener('touchend',e=>{e.preventDefault();joy.fire=false});

function mkTank(p,tm,tr,x,y){
  let b=DB.at(tr),m=p?{hp:1+(sd.upg.hp-1)*.15,dmg:1+(sd.upg.dmg-1)*.15,spd:1+(sd.upg.spd-1)*.07,rld:1-(sd.upg.rld-1)*.05}:{hp:1,dmg:1,spd:1,rld:1};
  return{p,tm,x,y,ang:tm==='a'?0:Math.PI,tur:tm==='a'?0:Math.PI,hp:Math.round(b.hp*m.hp),mhp:Math.round(b.hp*m.hp),dmg:Math.round(b.dmg*m.dmg),spd:b.spd*m.spd,rld:Math.max(.3,b.rld*m.rld),cd:0,sz:b.sz,bar:b.bar,col:p?'#f59e0b':(tm==='a'?'#3b82f6':'#ef4444'),ait:0,aia:tm==='a'?0:Math.PI};
}

$('play').onclick=()=>{
  $('hangar').classList.add('hidden');$('game').classList.remove('hidden');
  c.width=innerWidth;c.height=innerHeight;
  g={on:true,tanks:new Array(),bul:new Array(),kills:0,cx:0,cy:0,blk:new Array({x:350,y:200,w:100,h:100},{x:350,y:600,w:100,h:100},{x:950,y:200,w:100,h:100},{x:950,y:600,w:100,h:100},{x:650,y:380,w:100,h:140})};
  let tr=sd.sel;g.tanks.push(mkTank(true,'a',tr,120,450));
  new Array(150,300,600,750).forEach(y=>g.tanks.push(mkTank(false,'a',tr,120,y)));
  new Array(150,300,450,600,750).forEach(y=>g.tanks.push(mkTank(false,'e',tr,W-120,y)));
  lt=performance.now();requestAnimationFrame(loop);
};
$('pause').onclick=()=>endG(false,true);
$('to-hangar').onclick=()=>{$('m-res').classList.add('hidden');$('game').classList.add('hidden');$('hangar').classList.remove('hidden');ui()};

function wall(x,y,r){
  if(x-r<0||x+r>W||y-r<0||y+r>H)return true;
  for(let b of g.blk)if(Math.hypot(x-Math.max(b.x,Math.min(x,b.x+b.w)),y-Math.max(b.y,Math.min(y,b.y+b.h)))<r)return true;
  return false;
}
function shoot(t){
  if(t.cd>0)return;t.cd=t.rld;
  g.bul.push({x:t.x+Math.cos(t.tur)*(t.bar+4),y:t.y+Math.sin(t.tur)*(t.bar+4),vx:Math.cos(t.tur)*10,vy:Math.sin(t.tur)*10,dmg:t.dmg,tm:t.tm,bp:t.p});
  if(t.p)beep(140,.1);
}

let lt=0;
function loop(now){
  if(!g.on)return;
  let dt=Math.min(.05,(now-lt)/1000);lt=now;
  let ac=0,ec=0;
  for(let t of g.tanks){
    if(t.hp<=0)continue;
    if(t.tm==='a')ac++;else ec++;
    if(t.cd>0)t.cd-=dt;
    let tg=null,bd=9999;
    for(let o of g.tanks)if(o.hp>0&&o.tm!==t.tm){let d=Math.hypot(o.x-t.x,o.y-t.y);if(d<bd){bd=d;tg=o}}
    if(t.p){
      if(Math.hypot(joy.dx,joy.dy)>.1){
        t.ang=Math.atan2(joy.dy,joy.dx);
        let nx=t.x+joy.dx*t.spd,ny=t.y+joy.dy*t.spd;
        if(!wall(nx,t.y,t.sz))t.x=nx;if(!wall(t.x,ny,t.sz))t.y=ny;
      }
      t.tur=(tg&&bd<550)?Math.atan2(tg.y-t.y,tg.x-t.x):t.ang;
      if(joy.fire)shoot(t);
    }else{
      t.ait-=dt;
      if(tg){
        t.tur=Math.atan2(tg.y-t.y,tg.x-t.x);
        if(t.ait<=0){t.ait=.7;t.aia=t.tur+(bd<300?1.4:(Math.random()-.5))}
        if(bd<500)shoot(t);
      }
      let nx=t.x+Math.cos(t.aia)*t.spd*.8,ny=t.y+Math.sin(t.aia)*t.spd*.8;
      if(!wall(nx,ny,t.sz)){t.x=nx;t.y=ny;t.ang=t.aia}else{t.aia+=2;t.ait=.5}
    }
  }
  $('ac').innerText=ac;$('ec').innerText=ec;
  if(ec===0)return endG(true,false);if(ac===0)return endG(false,false);

  for(let i=g.bul.length-1;i>=0;i--){
    let b=g.bul.at(i);b.x+=b.vx;b.y+=b.vy;
    if(wall(b.x,b.y,3)){g.bul.splice(i,1);continue}
    for(let t of g.tanks)if(t.hp>0&&t.tm!==b.tm&&Math.hypot(b.x-t.x,b.y-t.y)<t.sz+4){
      t.hp-=b.dmg;if(t.hp<=0){beep(70,.25);if(b.bp)g.kills++}
      g.bul.splice(i,1);break;
    }
  }
  let ct=g.tanks.find(t=>t.p&&t.hp>0)||g.tanks.find(t=>t.tm==='a'&&t.hp>0);
  if(ct){g.cx=Math.max(0,Math.min(W-c.width,ct.x-c.width/2));g.cy=Math.max(0,Math.min(H-c.height,ct.y-c.height/2))}

  ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(-g.cx,-g.cy);
  ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.strokeRect(0,0,W,H);
  ctx.fillStyle='#4b5563';for(let b of g.blk)ctx.fillRect(b.x,b.y,b.w,b.h);
  for(let t of g.tanks){
    if(t.hp<=0)continue;ctx.save();ctx.translate(t.x,t.y);
    ctx.save();ctx.rotate(t.ang);ctx.fillStyle=t.col;ctx.fillRect(-t.sz,-t.sz*.75,t.sz*2,t.sz*1.5);ctx.restore();
    ctx.save();ctx.rotate(t.tur);ctx.fillStyle='#111';ctx.fillRect(0,-3,t.bar,6);ctx.beginPath();ctx.arc(0,0,t.sz*.5,0,Math.PI*2);ctx.fillStyle=t.col;ctx.fill();ctx.stroke();ctx.restore();
    if(sd.hpbar){ctx.fillStyle='#000';ctx.fillRect(-16,-t.sz-10,32,4);ctx.fillStyle=t.tm==='a'?'#10b981':'#ef4444';ctx.fillRect(-16,-t.sz-10,32*(t.hp/t.mhp),4)}
    ctx.restore();
  }
  ctx.fillStyle='#fef08a';for(let b of g.bul){ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}
  ctx.restore();requestAnimationFrame(loop);
}

function endG(w,ab){
  g.on=false;eJoy();joy.fire=false;
  let r=ab?0:(w?150+g.kills*40:40+g.kills*20);sd.coins+=r;save();
  $('r-title').innerText=ab?"ПРЕРВАНО":(w?"ПОБЕДА!":"ПОРАЖЕНИЕ");
  $('r-stat').innerText="Уничтожено врагов: "+g.kills;$('r-rew').innerText=r;
  $('m-res').classList.remove('hidden');
}
ui();
</script>
</body>
</html>
